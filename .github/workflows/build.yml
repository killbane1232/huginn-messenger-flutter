name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v<SemVer> tag merged into main; empty builds artifacts only'
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release from protected main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run build.yml --ref main --field "release_tag=$RELEASE_TAG"

  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: AndroidEnv
    outputs:
      version: ${{ steps.version.outputs.name }}
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select reviewed release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
              echo "Expected a v<SemVer> tag" >&2; exit 1;
            }
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            source_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            git merge-base --is-ancestor "$source_sha" origin/main || {
              echo "Release tags must point to a commit already merged into main" >&2; exit 1;
            }
            git checkout --detach "$source_sha"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev liblzma-dev libstdc++-12-dev

      - name: Flutter cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}

      - name: Set version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            VERSION_NAME="${RELEASE_TAG#v}"
            if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag must use a SemVer-compatible form such as v1.2.3" >&2
              exit 1
            fi
            ARTIFACT_VERSION="$VERSION_NAME"
          else
            VERSION_NAME="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*$/\1/p' pubspec.yaml)"
            ARTIFACT_VERSION="$(git rev-parse --short HEAD)"
          fi
          if [[ -z "$VERSION_NAME" ]]; then
            echo "Could not determine the application version" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "value=$ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "Missing GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/huginn-release.jks"

      - name: Build Huginn core libraries from latest main
        run: scripts/build-core-libraries.sh

      - name: Build Flutter APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/huginn-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --build-name="${{ steps.version.outputs.name }}"
          --build-number="${{ steps.version.outputs.code }}"

      - name: Build Flutter Linux app
        run: >-
          flutter build linux --release
          --build-name="${{ steps.version.outputs.name }}"
          --build-number="${{ steps.version.outputs.code }}"

      - name: Package Linux installer
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: bash scripts/package-linux.sh "$VERSION" x64

      - name: Rename APK
        run: |
          VERSION=${{ steps.version.outputs.value }}
          mv build/app/outputs/flutter-apk/app-release.apk \
             "huginn-messenger-${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huginn-messenger-apk
          path: huginn-messenger-${{ steps.version.outputs.value }}.apk

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: huginn-messenger-linux
          path: build/linux/x64/release/bundle

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-android
          path: |
            huginn-messenger-*.apk
            build/packages/*.deb
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build macOS app
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if ! command -v pod >/dev/null; then brew install cocoapods; fi
          flutter pub get
          scripts/build-apple-core.sh macos
          # Apple bundle versions accept only the numeric SemVer core.
          flutter build macos --release --build-name="${VERSION%%[-+]*}" --build-number="$BUILD_NUMBER"
      - name: Package macOS installer
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/package-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: build/packages/*.pkg
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: packages
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mapfile -d '' packages < <(find packages -type f \( -name '*.apk' -o -name '*.deb' -o -name '*.pkg' \) -print0)
          [[ ${#packages[@]} -eq 3 ]] || { echo "Expected APK, DEB and PKG" >&2; exit 1; }
          flags=()
          version="${RELEASE_TAG#v}"
          [[ "${version%%+*}" != *-* ]] || flags+=(--prerelease)
          # Publish only once all three assets have been uploaded successfully.
          gh release create "$RELEASE_TAG" "${packages[@]}" --verify-tag --draft \
            --title "Huginn $RELEASE_TAG" --generate-notes "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false

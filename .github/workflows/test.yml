name: Tests

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test core submodule build workflow
        run: python3 scripts/test_build_core.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.x'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          if ! command -v pod >/dev/null; then
            brew install cocoapods
          fi
      - name: Analyze, test and build macOS and iOS
        run: scripts/build-apple.sh
      - name: Test macOS Go FFI and SQLite
        run: |
          HUGINN_NATIVE_TESTS=1 \
          HUGINN_LIBRARY_PATH="$PWD/macos/Frameworks/huginn_messenger.framework/huginn_messenger" \
            flutter test test/muninn_native_test.dart test/muninn_connection_native_test.dart
      - name: Test native macOS startup and icons
        run: |
          flutter build macos --debug --target test/native_ui_host.dart
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO \
            FLUTTER_TARGET="$PWD/test/native_ui_host.dart"
      - name: Archive Apple apps
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/huginn_messenger.app huginn-macos.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app huginn-ios-unsigned.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app huginn-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: huginn-apple-apps
          path: huginn-*.zip

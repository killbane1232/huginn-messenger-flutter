name: huginn_messenger
description: "Huginn Messenger Flutter app."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  uuid: ^4.5.1
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3
  flutter_plugin_android_lifecycle: ^2.0.35
  flutter_local_notifications: ^22.2.0
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  crypto: ^3.0.7
  http: ^1.6.0
  package_info_plus: ^9.0.1
  pub_semver: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/config.json
